# Publishes a release when iptoasn.com's table changed, at most once a day,
# or when MAJOR.MINOR in package.json changed (a code release). Versions are
# MAJOR.MINOR.YYYYMMDD: see README.md, "Versions".
#
# The table isn't in git: it's built here and only lives in the npm package.
# Publishing uses npm's trusted publishing (OIDC): no token.
name: Release

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          # No dependency cache in a publishing workflow (setup-node's advice)
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@^11.5.1
      - run: npm install

      # The table of the latest release, to compare with. Only a 404 means
      # there is none: any other error fails the run, rather than releasing
      # a table nothing was compared with
      - name: Latest release
        id: latest
        run: |
          if version=$(npm view @hyperwatch/iptoasn version 2> npm-view.log); then
            dir=$(mktemp -d)
            npm pack "@hyperwatch/iptoasn@$version" --pack-destination "$dir" --silent > /dev/null
            tar -xzf "$dir"/*.tgz -C "$dir"
            echo "Latest release: $version"
            # Releases up to 1.0.20261117 have a table in another format: nothing
            # to compare with
            if [ -f "$dir/package/data/iptoasn.bin.br" ]; then
              mkdir -p data
              cp "$dir/package/data/iptoasn.bin.br" data/
            else
              echo "Its table isn't in the current format"
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          elif grep -q E404 npm-view.log; then
            echo "Never published"
          else
            cat npm-view.log
            exit 1
          fi

      # Fails, and keeps the table, when the new one looks wrong
      - name: Update the table
        id: update
        run: npm run update

      - name: Version
        id: version
        env:
          LATEST: ${{ steps.latest.outputs.version }}
          CHANGED: ${{ steps.update.outputs.changed }}
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          next=$(node scripts/version.js)
          if [ -z "$next" ]; then
            echo "Already released today: $LATEST"
          elif [ "$CHANGED" = true ] || [ "${LATEST%.*}" != "$base" ]; then
            echo "version=$next" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to release: the table and $base are those of $LATEST"
          fi

      - if: steps.version.outputs.version
        run: |
          npm test
          npm run lint
          npm run test:types

      - name: Publish
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public

      # A tag on the code the release was built from, and its notes
      - name: Tag and release notes
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE: ${{ steps.update.outputs.source }}
          SUMMARY: ${{ steps.update.outputs.summary }}
          BEFORE: ${{ steps.update.outputs.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          {
            echo "- **Table:** $SOURCE"
            echo "- **Ranges:** $SUMMARY"
            if [ -n "$BEFORE" ]; then
              echo "- **Before:** $BEFORE"
            fi
            echo "- **npm:** https://www.npmjs.com/package/@hyperwatch/iptoasn/v/$VERSION"
          } > release-notes.md
          gh release create "v$VERSION" --title "$VERSION" --notes-file release-notes.md
